server {
    listen 80;
    server_name anonymizator.barren.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anonymizator.barren.fr;

    ssl_certificate /etc/letsencrypt/live/anonymizator.barren.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anonymizator.barren.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Must match MAX_FILE_SIZE_MB + overhead
    client_max_body_size 10M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    proxy_hide_header Server;
    add_header Server "anonymizator" always;

    # CORS preflight is handled by FastAPI — do not duplicate here

    access_log /var/log/nginx/anonymizator_access.log;
    error_log /var/log/nginx/anonymizator_error.log;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
